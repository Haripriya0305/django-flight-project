{% extends 'main.html' %}

{% block content %}
 <br><br>

<center>
    <h2>Reset Password</h2>

    {% if messages %}
        {% for message in messages %}
            <h4>{{ message }}</h4>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
       
        {% if new %} 
            <input type="text" name="new_pasw" placeholder="Enter New Password" required><br><br>
            <input type="text" name="confirm_pasw" placeholder="Confirm Password" required><br><br>

            <button type="submit">Update Password</button>

        {% else %}
            <input type="password" name="old_pasw" placeholder="Enter Old Password" required><br><br>
            <button type="submit">Verify</button>
        {% endif %}
    </form>
</center>

{% endblock %}
