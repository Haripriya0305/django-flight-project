{% extends 'main.html' %}

{% block content %}
 <br><br>
<center>

<h2>Update Profile</h2>

{% if messages %}
    {% for message in messages %}
        <h3>{{ message }}</h3>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    <br><br>
    <input type="text" name="fname" value="{{ request.user.first_name }}"><br><br>

    <input type="text" name="lname" value="{{ request.user.last_name }}"><br><br>

    <input type="text" name="uname" value="{{ request.user.username }}"><br><br>

    <input type="email" name="email" value="{{ request.user.email }}"><br><br>

    <button type="submit">Update Profile</button>

</form>

</center>

{% endblock %}
